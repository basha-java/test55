<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Edit Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h3 class="text-center mb-4">Edit Student</h3>

        <form th:action="@{'/students/update/' + ${student.id}}"
              th:object="${student}" method="post">

            <div class="mb-3">
                <label>First Name</label>
                <input type="text" th:field="*{firstName}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Last Name</label>
                <input type="text" th:field="*{lastName}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" th:field="*{email}" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary">Update</button>
            <a th:href="@{/students}" class="btn btn-secondary">Back</a>

        </form>
    </div>
</div>

</body>
</html>
