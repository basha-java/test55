<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
<title>Student Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">SMS</a>
        <div>
            <a class="nav-link d-inline text-white" th:href="@{/students}">All Students</a>

            <!-- 👇 Only ADMIN can see -->
            <a class="nav-link d-inline text-white"
               th:href="@{/students/add}"
               sec:authorize="hasRole('ADMIN')">
               Add Students
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h2>List of all students</h2>

    <!-- 👇 Only ADMIN -->
    <a th:href="@{/students/add}"
       class="btn btn-success mb-3"
       sec:authorize="hasRole('ADMIN')">
        <i class="bi bi-person-plus"></i> Add Student
    </a>

    <!-- 👇 USER view (example) -->
    <div sec:authorize="hasRole('USER')">
        <h5>Total Students: <span th:text="${#lists.size(students)}"></span></h5>
    </div>

    <!-- Table -->
    <table class="table table-bordered table-striped text-center">
        <thead class="table-dark">
        <tr>
            <th>Student ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>

            <!-- 👇 Only ADMIN sees Action column -->
            <th sec:authorize="hasRole('ADMIN')">Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="s : ${students}">
            <td th:text="${s.id}"></td>
            <td th:text="${s.firstName}"></td>
            <td th:text="${s.lastName}"></td>
            <td th:text="${s.email}"></td>

            <!-- 👇 Only ADMIN sees buttons -->
            <td sec:authorize="hasRole('ADMIN')">
                <a th:href="@{'/students/edit/' + ${s.id}}"
                   class="btn btn-primary btn-sm">
                    <i class="bi bi-pencil"></i>
                </a>

                <a th:href="@{'/students/delete/' + ${s.id}}"
                   class="btn btn-danger btn-sm">
                    <i class="bi bi-person-x"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
